name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/calculer.test.js tests/quiz.test.js tests/site.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Seuls les fichiers du site sont publiés : ni le script serveur (backend/), ni les tests, ni la configuration GitHub.
      - name: Préparer le site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='backend' --exclude='tests' --exclude='outils' --exclude='_site' --exclude='README.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4